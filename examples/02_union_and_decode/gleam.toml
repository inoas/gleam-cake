name = "cake_demo_union_and_decode"
description = "A demo of using Gleam with Cake and 🐘PostgreSQL to run UNION queries and decode returning data into Gleam records"
gleam = ">= 1.15.0"

[dependencies]
cake = { path = "../../" }
cake_pog = ">= 1.2.0 and < 2.0.0"
gleam_stdlib = ">= 0.62.0 and < 2.0.0"
examples_helper = { path = "../examples_helper" }
